<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice DAW – Round 2</title>
<style>
:root{--bg:#0F1115;--panel:#171A21;--line:#262B35;--txt:#E8EAF0;--mut:#8A93A6;--acc:#6A46FF;--acc2:#9B87FF;--mint:#2EE6A6;--org:#FF8A4C;--sky:#4CC3FF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 12px}
.warn{color:var(--org);font-size:13px;margin:0 0 8px}
.mut{color:var(--mut);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.btn{padding:12px 20px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.btn.small{padding:8px 14px;font-weight:500;font-size:13px}
.btn.rec{background:var(--mint);color:#0B1210;border:0}
.btn.rec.on{background:#FF6B7A;color:#0B0D12}
.inline{display:flex;align-items:center;gap:8px;margin:0}
input[type=number]{width:80px;padding:8px;border-radius:8px;background:var(--bg);color:var(--txt);border:1px solid var(--line);font:inherit}
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.tab[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.read{text-align:center;padding:16px 0}
.big{font-size:52px;font-weight:700;line-height:1.1}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.pad{border:1px solid var(--line);border-radius:12px;padding:24px 0;text-align:center;font-weight:700;background:var(--bg)}
label{display:block;margin:14px 0 4px;color:var(--mut);font-size:13px}
select,input[type=range]{width:100%}
select{padding:10px;border-radius:10px;background:var(--bg);color:var(--txt);border:1px solid var(--line);font:inherit}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--mint)}
.hide{display:none}
.grow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gname{width:64px;color:var(--mut);font-size:13px}
.cells{flex:1;display:grid;gap:2px}
.cells i{height:22px;background:#1E222B;border-radius:3px}
.cells i.q{box-shadow:inset 2px 0 #3A4150}
.cells i.d{background:var(--org)}
.cells i.m{background:var(--acc2)}
.cells i.now{outline:2px solid #fff;outline-offset:-2px}
</style>
</head>
<body>
<main>
  <h1>Voice DAW – Round 2</h1>
  <p class="sub">Record a loop with your mouth. Layer drums first, then a melody on top.</p>
  <p class="warn">Use headphones. Speakers will feed back into the mic.</p>
  <p class="mut" id="msg" role="status"></p>

  <section class="panel">
    <div class="row">
      <button class="btn rec" id="rec">Record</button>
      <button class="btn" id="play">Play loop</button>
      <span class="mut" id="status" role="status">Ready</span>
    </div>
    <div class="row">
      <label class="inline">Tempo (BPM) <input type="number" id="bpm" min="60" max="180" value="100"></label>
      <label class="inline">Loop length
        <select id="bars"><option value="1">1 bar</option><option value="2" selected>2 bars</option><option value="4">4 bars</option></select>
      </label>
      <label class="inline"><input type="checkbox" id="metro" checked> Metronome</label>
    </div>
  </section>

  <section class="panel">
    <div id="grid"></div>
    <div class="row" style="margin:12px 0 0">
      <button class="btn small" id="clrD">Clear drums</button>
      <button class="btn small" id="clrM">Clear melody</button>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" role="group" aria-label="What are you recording?">
      <button class="tab" id="tHum" aria-pressed="true">Hum a melody</button>
      <button class="tab" id="tBeat" aria-pressed="false">Beatbox drums</button>
    </div>
    <div id="humBox" class="read"><div class="big" id="note">–</div><div class="mut" id="hz">Hum a steady note</div></div>
    <div id="beatBox" class="hide">
      <div class="pads"><div class="pad" id="p-kick">Kick</div><div class="pad" id="p-snare">Snare</div><div class="pad" id="p-hat">Hi-hat</div></div>
      <p class="mut" id="stats" style="text-align:center">Last hit: low –, high –</p>
    </div>
    <label for="inst">Melody instrument (changes the whole recorded melody)</label>
    <select id="inst"><option value="bass">Bass</option><option value="sub">808 sub</option><option value="lead">Lead synth</option><option value="pad">Pad</option></select>
  </section>

  <section class="panel">
    <label for="gate" style="margin-top:0">Mic sensitivity (right picks up quieter sounds)</label>
    <input type="range" id="gate" min="1" max="100" value="50">
    <label for="kSplit">Kick sensitivity (right = more kicks)</label>
    <input type="range" id="kSplit" min="0" max="100" value="55">
    <label for="hSplit">Hi-hat sensitivity (right = more hi-hats)</label>
    <input type="range" id="hSplit" min="0" max="100" value="55">
    <label for="vol">Volume</label>
    <input type="range" id="vol" min="0" max="100" value="70">
    <label>Mic level</label>
    <div class="meter"><i id="lvl"></i></div>
  </section>
</main>
<script>
// All sound output: live monitoring voice, loop notes, drums, metronome click.
const Synth = (() => {
  const INST = {
    bass: {t1:'sawtooth', t2:'square',   det:6,  cut:700,  atk:0.01, rel:0.12, oct:-1},
    sub:  {t1:'sine',     t2:'sine',     det:0,  cut:400,  atk:0.01, rel:0.20, oct:-1},
    lead: {t1:'sawtooth', t2:'sawtooth', det:12, cut:3500, atk:0.01, rel:0.10, oct:0},
    pad:  {t1:'triangle', t2:'sawtooth', det:8,  cut:1200, atk:0.15, rel:0.50, oct:0}
  };
  let ctx, master, noise, live, cur = 'bass';
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function init(c) {
    ctx = c;
    master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
    o1.start(); o2.start();
    live = {o1, o2, f, g};
    setInst(cur);
  }
  function setVolume(v) { if (master) master.gain.value = v; }
  function setInst(k) {
    cur = k;
    if (!live) return;
    const i = INST[k];
    live.o1.type = i.t1; live.o2.type = i.t2;
    live.o2.detune.value = i.det; live.f.frequency.value = i.cut;
  }
  // Live voice: plays while you hum so you hear yourself as the instrument.
  function liveOn(m) {
    const i = INST[cur], f = hz(m) * Math.pow(2, i.oct), t = ctx.currentTime;
    live.o1.frequency.setTargetAtTime(f, t, 0.015);
    live.o2.frequency.setTargetAtTime(f, t, 0.015);
    live.g.gain.setTargetAtTime(0.5, t, i.atk);
  }
  function liveOff() { live.g.gain.setTargetAtTime(0, ctx.currentTime, INST[cur].rel / 3); }

  // One scheduled note (used by loop playback).
  function note(m, dur, t) {
    const i = INST[cur], f = hz(m) * Math.pow(2, i.oct), d = Math.max(dur, i.atk);
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    const fl = ctx.createBiquadFilter(), g = ctx.createGain();
    o1.type = i.t1; o2.type = i.t2; o2.detune.value = i.det;
    o1.frequency.value = f; o2.frequency.value = f;
    fl.type = 'lowpass'; fl.frequency.value = i.cut;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.5, t + i.atk);
    g.gain.setValueAtTime(0.5, t + d);
    g.gain.linearRampToValueAtTime(0.0001, t + d + i.rel);
    o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(master);
    const end = t + d + i.rel + 0.05;
    o1.start(t); o2.start(t); o1.stop(end); o2.stop(end);
  }

  function drum(type, t) {
    if (type === 'kick') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      g.gain.setValueAtTime(1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.45);
      return;
    }
    const hat = type === 'hat', dur = hat ? 0.06 : 0.2;
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noise;
    f.type = 'highpass'; f.frequency.value = hat ? 7000 : 1500;
    g.gain.setValueAtTime(hat ? 0.5 : 0.8, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t + dur + 0.02);
    if (!hat) {
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = 190;
      og.gain.setValueAtTime(0.5, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.15);
    }
  }
  function click(t, accent) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = accent ? 1600 : 1000;
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.05);
  }
  return {init, setVolume, setInst, liveOn, liveOff, note, drum, click};
})();
</script>
<script>
// Listens to the mic. Hum mode emits notes, beat mode emits kick/snare/hat hits.
const Detect = (() => {
  const S = {gate: 0.022, kThr: 0.47, hThr: 0.37};
  let ctx, an, tbuf, fbuf, cb = {}, mode = 'hum';
  let prevRms = 0, lastHit = 0, pending = false, cand = -1, cc = 0, cur = -1, silent = 0;

  function init(c, a, callbacks) {
    ctx = c; an = a; cb = callbacks;
    tbuf = new Float32Array(an.fftSize);
    fbuf = new Float32Array(an.frequencyBinCount);
  }
  function set(k, v) { S[k] = v; }
  function setMode(m) { endNote(); mode = m; pending = false; }
  function endNote() {
    if (cur >= 0 && cb.onNoteOff) cb.onNoteOff(ctx.currentTime);
    cur = -1; cand = -1; cc = 0;
  }

  function pitch(b, sr) {
    const N = 1024, minL = Math.floor(sr / 900), maxL = Math.floor(sr / 70);
    let e0 = 0;
    for (let i = 0; i < N; i++) e0 += b[i] * b[i];
    const c = new Float32Array(maxL + 2);
    let best = 0, bl = 0;
    for (let l = minL; l <= maxL; l++) {
      let s = 0, e1 = 0;
      for (let i = 0; i < N; i++) { s += b[i] * b[i + l]; e1 += b[i + l] * b[i + l]; }
      c[l] = s / Math.sqrt(e0 * e1 + 1e-9);
      if (c[l] > best) { best = c[l]; bl = l; }
    }
    if (best < 0.8) return 0;
    for (let l = minL + 1; l < bl; l++) {
      if (c[l] > 0.9 * best && c[l] >= c[l - 1] && c[l] >= c[l + 1]) { bl = l; break; }
    }
    const a = c[bl - 1], m = c[bl], d = c[bl + 1], den = 2 * (a - 2 * m + d);
    const shift = den ? (a - d) / den : 0;
    return sr / (bl + (isFinite(shift) ? shift : 0));
  }

  function hum(rms) {
    const f = rms > S.gate ? pitch(tbuf, ctx.sampleRate) : 0;
    if (!f) { if (++silent > 3 && cur >= 0) endNote(); return; }
    silent = 0;
    const m = Math.round(69 + 12 * Math.log2(f / 440));
    if (m === cand) cc++; else { cand = m; cc = 1; }
    if (cc >= 3 && m !== cur) {
      if (cur >= 0 && cb.onNoteOff) cb.onNoteOff(ctx.currentTime);
      cur = m;
      if (cb.onNoteOn) cb.onNoteOn(m, ctx.currentTime, f);
    }
  }

  function beat(rms, now) {
    if (pending) { pending = false; classify(); }
    else if (rms > S.gate && rms > prevRms * 1.6 && now - lastHit > 100) { pending = true; lastHit = now; }
    prevRms = Math.max(rms, prevRms * 0.85);
  }
  function classify() {
    an.getFloatFrequencyData(fbuf);
    const bw = ctx.sampleRate / an.fftSize;
    let lo = 0, mi = 0, hi = 0;
    for (let i = 1; i < fbuf.length; i++) {
      const f = i * bw, p = Math.pow(10, fbuf[i] / 10);
      if (f < 250) lo += p; else if (f < 3000) mi += p; else hi += p;
    }
    const t = lo + mi + hi + 1e-12, L = lo / t, H = hi / t;
    const type = L > S.kThr ? 'kick' : (H > S.hThr ? 'hat' : 'snare');
    if (cb.onHit) cb.onHit(type, ctx.currentTime, L, H);
  }

  function tick(now) {
    if (!an) return 0;
    an.getFloatTimeDomainData(tbuf);
    let s = 0;
    for (let i = 1536; i < 2048; i++) s += tbuf[i] * tbuf[i];
    const rms = Math.sqrt(s / 512);
    if (mode === 'hum') hum(rms); else beat(rms, now);
    return rms;
  }
  return {init, set, setMode, tick};
})();
</script>
<script>
// Transport, metronome, recording and loop playback. Everything is stored as
// quantized events on a 16th-note grid, so the instrument can change afterward.
//   tracks.drums  = [{step, type}]
//   tracks.melody = [{step, len, midi}]
const Looper = (() => {
  const S = {bpm: 100, bars: 2, metro: true, mode: 'hum',
             running: false, recording: false, armed: false, pending: false, recEnd: 0};
  const tracks = {drums: [], melody: []};
  let ctx, opts = {}, timer, n = 0, nextTime = 0, t0 = 0, open = null;
  const sd = () => 60 / S.bpm / 4;          // seconds per 16th note
  const total = () => S.bars * 16;          // steps in the loop

  function init(c, o) { ctx = c; opts = o; }
  function status() {
    if (!S.running) return 'stopped';
    if (S.recording) return 'recording';
    if (S.armed) return 'armed';
    if (n < 0) return 'countin';
    return 'playing';
  }
  function emit() { if (opts.onState) opts.onState(status()); }
  function changed() { if (opts.onChange) opts.onChange(); }

  function start(rec) {
    if (S.running) return;
    S.running = true; S.pending = rec; S.recording = false; S.armed = false;
    n = rec ? -16 : 0;                       // one bar of count-in when recording
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(pump, 25);
    pump(); emit();
  }
  function stop() {
    if (!S.running) return;
    clearInterval(timer);
    closeNote(ctx.currentTime);
    S.running = false; S.recording = false; S.armed = false; S.pending = false;
    emit();
  }
  function arm() {
    if (!S.running || S.recording) return;
    S.armed = !S.armed; emit();
  }

  function pump() {
    while (nextTime < ctx.currentTime + 0.12) { sched(n, nextTime); nextTime += sd(); n++; }
  }
  function sched(k, t) {
    const T = total();
    if (k >= 0) {
      const s = k % T;
      if (s === 0) {
        t0 = t;
        if (S.recording && k > 0) { closeNote(t); S.recording = false; S.recEnd = t + 0.06; }
        else if (S.pending || S.armed) { S.recording = true; S.pending = false; S.armed = false; }
        emit();
      }
      for (const e of tracks.drums) if (e.step === s) Synth.drum(e.type, t);
      for (const e of tracks.melody) if (e.step === s) Synth.note(e.midi, e.len * sd(), t);
    }
    if (S.metro && k % 4 === 0) Synth.click(t, k % 16 === 0);
    if (opts.onStep) opts.onStep(k >= 0 ? k % T : -1, t);
  }

  const active = () => S.recording || ctx.currentTime < S.recEnd;
  function stepAt(time, lat) {               // nearest 16th, with mic latency removed
    const T = total(), k = Math.round((time - lat - t0) / sd());
    return ((k % T) + T) % T;
  }
  function hit(type, t) {
    if (!active() || S.mode !== 'beat') return;
    const s = stepAt(t, 0.04);
    if (!tracks.drums.some(e => e.step === s && e.type === type)) { tracks.drums.push({step: s, type}); changed(); }
  }
  function noteOn(m, t) { if (active() && S.mode === 'hum') open = {m, t}; }
  function noteOff(t) { closeNote(t); }
  function closeNote(t) {
    if (!open) return;
    const T = total(), s = stepAt(open.t, 0.07);
    const len = Math.max(1, Math.min(Math.round((t - open.t) / sd()), T - s));
    tracks.melody.push({step: s, midi: open.m, len});
    open = null; changed();
  }

  function clear(which) { tracks[which].length = 0; changed(); }
  function setBpm(v) { if (!S.running) S.bpm = v; }
  function setBars(v) { if (!S.running) S.bars = v; }
  function setMetro(v) { S.metro = v; }
  function setMode(m) { S.mode = m; }
  return {init, start, stop, arm, hit, noteOn, noteOff, clear, setBpm, setBars, setMetro, setMode,
          tracks, total, status, isRunning: () => S.running};
})();
</script>
<script>
// Wires the screen, the mic, the detector, the synth and the looper together.
(function () {
  const $ = id => document.getElementById(id);
  const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const COL = {kick: '#FF8A4C', snare: '#4CC3FF', hat: '#2EE6A6'};
  let ctx, stream, analyser, mode = 'hum', prevS = -1;
  const noteName = m => NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

  async function ensureMic() {
    if (ctx) return true;
    try {
      const c = new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'interactive'});
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}
      });
      ctx = c;
    } catch (e) {
      $('msg').textContent = 'Could not open the microphone: ' + e.message + ' (use https or localhost, and allow mic access).';
      return false;
    }
    await ctx.resume();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0;
    ctx.createMediaStreamSource(stream).connect(analyser);   // mic never goes to the speakers
    Synth.init(ctx);
    applySettings();
    Detect.init(ctx, analyser, {
      onHit(type, t, L, H) {
        Synth.drum(type, ctx.currentTime); Looper.hit(type, t); flash(type);
        $('stats').textContent = 'Last hit: low ' + Math.round(L * 100) + '%, high ' + Math.round(H * 100) + '%';
      },
      onNoteOn(m, t, f) { Synth.liveOn(m); Looper.noteOn(m, t); show(noteName(m), Math.round(f) + ' Hz'); },
      onNoteOff(t) { Synth.liveOff(); Looper.noteOff(t); show('–', 'Hum a steady note'); }
    });
    Looper.init(ctx, {
      onState: setState,
      onStep: (s, t) => setTimeout(() => mark(s), Math.max(0, (t - ctx.currentTime) * 1000)),
      onChange: renderGrid
    });
    Detect.setMode(mode);
    requestAnimationFrame(loop);
    return true;
  }

  function loop(now) {
    const rms = Detect.tick(now);
    $('lvl').style.width = Math.min(100, rms * 400) + '%';
    requestAnimationFrame(loop);
  }
  function show(n, h) { $('note').textContent = n; $('hz').textContent = h; }
  function flash(type) {
    const el = $('p-' + type);
    el.style.background = COL[type]; el.style.color = '#0B0D12';
    setTimeout(() => { el.style.background = ''; el.style.color = ''; }, 120);
  }

  /* ----- loop grid ----- */
  function renderGrid() {
    const T = Looper.total(), g = $('grid');
    g.innerHTML = ''; prevS = -1;
    [['drums', 'Drums'], ['melody', 'Melody']].forEach(([k, label]) => {
      const row = document.createElement('div'); row.className = 'grow';
      const nm = document.createElement('span'); nm.className = 'gname'; nm.textContent = label;
      const cells = document.createElement('div'); cells.className = 'cells';
      cells.style.gridTemplateColumns = 'repeat(' + T + ',1fr)';
      for (let s = 0; s < T; s++) { const c = document.createElement('i'); if (s % 4 === 0) c.className = 'q'; cells.appendChild(c); }
      Looper.tracks[k].forEach(e => {
        for (let j = 0; j < (e.len || 1); j++) { const c = cells.children[e.step + j]; if (c) c.classList.add(k === 'drums' ? 'd' : 'm'); }
      });
      row.appendChild(nm); row.appendChild(cells); g.appendChild(row);
    });
  }
  function mark(s) {
    document.querySelectorAll('.cells').forEach(r => {
      if (prevS >= 0 && r.children[prevS]) r.children[prevS].classList.remove('now');
      if (s >= 0 && r.children[s]) r.children[s].classList.add('now');
    });
    prevS = s;
  }

  /* ----- buttons and status ----- */
  const LABELS = {
    stopped:   ['Record', 'Play loop', 'Ready'],
    countin:   ['Get ready…', 'Stop', 'Count-in: recording starts after one bar'],
    recording: ['Recording', 'Stop', 'Recording one pass of the loop'],
    armed:     ['Overdub next pass', 'Stop', 'Will record on the next pass'],
    playing:   ['Overdub', 'Stop', 'Playing. Press Overdub to add more.']
  };
  function setState(st) {
    const l = LABELS[st];
    $('rec').textContent = l[0]; $('play').textContent = l[1]; $('status').textContent = l[2];
    $('rec').classList.toggle('on', st === 'recording' || st === 'countin' || st === 'armed');
    $('bpm').disabled = $('bars').disabled = st !== 'stopped';
  }
  $('rec').onclick = async () => {
    if (!(await ensureMic())) return;
    if (Looper.isRunning()) Looper.arm(); else Looper.start(true);
  };
  $('play').onclick = async () => {
    if (!(await ensureMic())) return;
    if (Looper.isRunning()) Looper.stop(); else Looper.start(false);
  };
  $('clrD').onclick = () => Looper.clear('drums');
  $('clrM').onclick = () => Looper.clear('melody');

  /* ----- settings ----- */
  function setMode(m) {
    mode = m; Looper.setMode(m);
    $('tHum').setAttribute('aria-pressed', m === 'hum');
    $('tBeat').setAttribute('aria-pressed', m === 'beat');
    $('humBox').classList.toggle('hide', m !== 'hum');
    $('beatBox').classList.toggle('hide', m !== 'beat');
    if (ctx) Detect.setMode(m);
  }
  function applySettings() {
    Synth.setVolume($('vol').value / 100);
    Synth.setInst($('inst').value);
    Detect.set('gate', 0.002 + 0.08 * Math.pow(1 - $('gate').value / 100, 2));
    Detect.set('kThr', 0.8 - 0.6 * $('kSplit').value / 100);
    Detect.set('hThr', 0.7 - 0.6 * $('hSplit').value / 100);
  }
  $('tHum').onclick = () => setMode('hum');
  $('tBeat').onclick = () => setMode('beat');
  ['vol', 'inst', 'gate', 'kSplit', 'hSplit'].forEach(id => { $(id).oninput = () => ctx && applySettings(); });
  $('bpm').onchange = e => {
    const v = Math.min(180, Math.max(60, parseInt(e.target.value) || 100));
    e.target.value = v; Looper.setBpm(v);
  };
  $('bars').onchange = e => { Looper.setBars(parseInt(e.target.value)); renderGrid(); };
  $('metro').onchange = e => Looper.setMetro(e.target.checked);

  renderGrid();
})();
</script>
</body>
</html>
